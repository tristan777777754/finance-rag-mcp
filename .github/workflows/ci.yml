name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  LOCAL_IMAGE: stock-research-ai:${{ github.sha }}
  REMOTE_IMAGE: ghcr.io/tristan777777754/stock-research-ai:${{ github.sha }}
  CONTAINER_NAME: stock-research-ai-ci

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run offline contract tests
        run: python -m pytest -q

      - name: Build container image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${LOCAL_IMAGE}" \
            .

      - name: Verify image contains no credential environment variables
        run: |
          if docker image inspect "${LOCAL_IMAGE}" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Eqi '(api[_-]?key|token|secret)'; then
            echo "Container image configuration must not contain credentials."
            exit 1
          fi

      - name: Validate Streamlit health endpoint
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            if [ "${status}" -ne 0 ]; then
              docker logs "${CONTAINER_NAME}" || true
            fi
            docker rm --force "${CONTAINER_NAME}" || true
            exit "${status}"
          }

          trap cleanup EXIT
          docker run --detach --rm --name "${CONTAINER_NAME}" -p 8501:8501 "${LOCAL_IMAGE}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Streamlit health endpoint did not become ready within 60 seconds."
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"
